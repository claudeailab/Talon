# Builds the iPhone app (ios/) on a Mac whenever it changes, so a broken build shows up
# at once. It is not signed: install it from Xcode (see ios/README.md).
name: iOS app
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build for the iOS Simulator
        run: |
          cd ios
          xcodebuild build -project Talon.xcodeproj -scheme Talon \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
          exit ${PIPESTATUS[0]}

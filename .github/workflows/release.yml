# Publishes a GitHub Release whenever backend/talon/__init__.py gets a new
# __version__ on main. Installed Talon systems detect the release and offer the
# update in the web interface (Settings → Software update).
# Release notes come from CHANGELOG.md (see .github/scripts/release_notes.py);
# editing CHANGELOG.md also updates the notes of releases already published.
name: Release
on:
  push:
    branches: [main]
    paths: [backend/talon/__init__.py, CHANGELOG.md]
  workflow_run:            # merges done by auto-merge.yml use GITHUB_TOKEN, which
    workflows: [Auto-merge to main]   # does not trigger push workflows by itself
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:             # one release run at a time; a second run sees the tag and skips
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, fetch-depth: 0 }
      - name: Read version
        id: v
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/talon/__init__.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - name: Verify web build is committed
        if: steps.v.outputs.exists != '1'
        run: test -f backend/talon/web/index.html
      - name: Create release
        if: steps.v.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
          else
            python3 .github/scripts/release_notes.py "$VERSION" "$REPO" > "$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Talon v$VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Sync release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch -q --force --tags origin
          for v in $(sed -n 's/^## \([0-9][0-9.]*\)[[:space:]]*$/\1/p' CHANGELOG.md); do
            gh release view "v$v" --repo "$REPO" >/dev/null 2>&1 || continue
            python3 .github/scripts/release_notes.py "$v" "$REPO" > "$RUNNER_TEMP/notes.md"
            if [ "$(gh release view "v$v" --repo "$REPO" --json body --jq .body)" != "$(cat "$RUNNER_TEMP/notes.md")" ]; then
              gh release edit "v$v" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
              echo "v$v: notes updated"
            fi
          done

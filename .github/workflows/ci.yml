# One run per commit on main: test, then release, then publish the website.
# - release: publishes a GitHub Release when __version__ in backend/talon/__init__.py
#   is new. Installed Talon systems offer it in Settings → Update. Notes come from
#   CHANGELOG.md (.github/scripts/release_notes.py); editing CHANGELOG.md also
#   updates the notes of releases already published.
# - pages: publishes site/ (screenshot gallery) to https://claudeailab.github.io/Talon/
#   when the site, screenshots or logo changed.
# Nothing is released or published unless the tests pass.
name: CI
on:
  push:
    branches: [main]
  workflow_run:            # merges done by auto-merge.yml use GITHUB_TOKEN, which
    workflows: [Auto-merge to main]   # does not trigger push workflows by itself
    types: [completed]
  workflow_dispatch:
concurrency:             # one run at a time; a later run sees an existing tag and skips it
  group: ci
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      site: ${{ steps.site.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Did the website change?
        id: site
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || git diff --name-only "$BEFORE" HEAD | grep -qE '^(site/|docs/screenshots/|docs/logo\.svg$|frontend/public/guide/|\.github/workflows/ci\.yml$)'; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt pytest pytest-xdist httpx shellcheck-py
      - run: cd backend && python -m pytest -q -n 8 tests   # tests mostly wait: run 8 at a time
      - run: shellcheck -S warning install.sh uninstall.sh
      - run: cd frontend && npm ci && npm run build
      - name: Committed web build is up to date
        run: git diff --stat --exit-code -- backend/talon/web site/guide.json || (echo "Run 'npm run build' in frontend/ and commit" && exit 1)

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.test.outputs.sha }}", fetch-depth: 0 }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.test.outputs.sha }}
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/talon/__init__.py)
          if gh release view "v$v" --repo "$REPO" >/dev/null 2>&1; then
            echo "v$v is already released"
          else
            python3 .github/scripts/release_notes.py "$v" "$REPO" > "$RUNNER_TEMP/notes.md"
            gh release create "v$v" --repo "$REPO" --target "$SHA" --title "Talon v$v" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Sync release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch -q --force --tags origin
          python3 .github/scripts/sync_release_notes.py "$REPO"

  about:
    # Keeps the repository's About section (description, website, topics) in sync.
    # Changing it needs a token with "Administration: write"; GITHUB_TOKEN cannot,
    # so this runs only when the ADMIN_TOKEN secret exists.
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Update the About section
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No ADMIN_TOKEN secret: the About section was not updated"
            exit 0
          fi
          # an expired or revoked token only skips this; it never fails the release
          if gh api -X PATCH "repos/$REPO" \
               -f description="Self-hosted NAS software for Debian, Ubuntu and Raspberry Pi OS: RAID, shared folders, users, OneDrive backup and alerts, managed from your browser." \
               -f homepage="https://claudeailab.github.io/Talon/" >/dev/null &&
             gh api -X PUT "repos/$REPO/topics" \
               -f "names[]=nas" -f "names[]=self-hosted" -f "names[]=home-server" -f "names[]=file-server" \
               -f "names[]=raid" -f "names[]=mdadm" -f "names[]=samba" -f "names[]=nfs" \
               -f "names[]=debian" -f "names[]=ubuntu" -f "names[]=raspberry-pi" -f "names[]=onedrive" >/dev/null; then
            echo "About section updated"
          else
            echo "::warning::ADMIN_TOKEN could not update the About section (expired or missing permission)"
          fi

  pages:
    needs: test
    if: needs.test.outputs.site == '1'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.test.outputs.sha }}" }
      - uses: actions/configure-pages@v6
      - name: Build site
        run: |
          mkdir -p _site/screenshots _site/guide
          cp site/*.html site/style.css site/guide.json docs/logo.svg _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp frontend/public/guide/*.webp _site/guide/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages looks the upload up immediately and fails when GitHub has not
      # listed it yet ("No artifacts named github-pages"): wait until it is listed
      - name: Wait until the upload is listed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 30); do
            n=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            [ "$n" -gt 0 ] && exit 0
            sleep 2
          done
          echo "::warning::The upload is still not listed; trying to publish anyway"
      # GitHub sometimes still reports the upload as missing for a short while: try
      # again after a pause instead of failing the run
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5

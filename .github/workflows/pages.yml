# Publishes the project website (screenshot gallery) to GitHub Pages:
# https://claudeailab.github.io/Talon/
name: Pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/**, docs/logo.svg, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build site
        run: |
          mkdir -p _site/screenshots
          cp site/index.html docs/logo.svg _site/
          cp docs/screenshots/*.png _site/screenshots/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

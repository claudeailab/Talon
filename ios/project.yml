# Xcode project for the Talon iPhone app. Generate it with XcodeGen:
#   brew install xcodegen && cd ios && xcodegen && open Talon.xcodeproj
name: Talon
options:
  bundleIdPrefix: io.github.claudeailab
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Talon:
    type: application
    platform: iOS
    sources: [Talon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.claudeailab.talon
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Talon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Talon backs up your photos and videos to your NAS.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Talon connects to your NAS on your home network.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Talon/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
